syntax = "proto3";

package feedium;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "feedium/api/feedium;feedium";

// FeedItem is a post paired with its current relevance score (FT-010 CTR-04).
message FeedItem {
  string post_id = 1;
  string source_id = 2;
  string author = 3;
  string text = 4;
  google.protobuf.Timestamp published_at = 5;
  double score = 6;
  // url is a best-effort link to the original source material; empty when unavailable.
  string url = 7;
  // reaction is the current user reaction: "like", "dislike", or "" if none.
  string reaction = 8;
}

message V1ListFeedRequest {
  // Inclusive lower/upper bounds on published_at; empty means unbounded.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // Minimum score threshold in [0,1]; items below are excluded (REQ-04).
  double min_score = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message V1ListFeedResponse {
  repeated FeedItem items = 1;
  string next_page_token = 2;
}

message V1ReactToPostRequest {
  string post_id = 1;
  // signal must be "like" or "dislike".
  string signal = 2;
}

message V1ReactToPostResponse {}

service FeedService {
  rpc V1ListFeed(V1ListFeedRequest) returns (V1ListFeedResponse) {
    option (google.api.http) = {
      get: "/v1/feed"
    };
  }
  rpc V1ReactToPost(V1ReactToPostRequest) returns (V1ReactToPostResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/react"
      body: "*"
    };
  }
}

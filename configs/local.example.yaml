server:
  http:
    addr: 0.0.0.0:8000
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 10s
data:
  database:
    host: 127.0.0.1
    port: 5432
    database: feedium
    user: feedium
    password: feedium
    sslmode: disable
summary:
  worker:
    poll_interval: 5s
    concurrency: 2
    lease_ttl: 300s
    heartbeat_interval: 60s
    graceful_timeout: 10s
    max_attempts: 3
    backoff_base: 10s
    backoff_max: 600s
  source_scheduler:
    poll_interval: 5s
  reaper:
    interval: 60s
    grace: 30s
  cron:
    interval: 3600s
  llm:
    timeout: 60s
    max_retries: 3
    # Default provider for every processing mode without an override.
    provider: anthropic
    # Per-mode override (FT-021): self_contained = posts, cumulative = digests.
    mode_providers:
      self_contained: anthropic
      cumulative: anthropic
    providers:
      openrouter:
        protocol: openai # OpenAI-compatible /chat/completions
        api_key: "REPLACE_WITH_YOUR_OPENROUTER_API_KEY"
        base_url: "https://openrouter.ai/api/v1"
        model: "openai/gpt-4o-mini"
      anthropic:
        protocol: anthropic # Claude Messages API
        api_key: "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY"
        base_url: "https://api.anthropic.com"
        model: "claude-haiku-5-5"
        max_tokens: 16000
        effort: low # low | medium | high | xhigh | max; empty = model default
  cumulative:
    max_window: 259200s
    max_input_chars: 50000
  outbox:
    event_ttl: 86400s
scoring:
  worker:
    poll_interval: 5s
    concurrency: 2
    lease_ttl: 300s
    heartbeat_interval: 60s
    graceful_timeout: 10s
    max_attempts: 3
    backoff_base: 10s
    backoff_max: 600s
    event_ttl: 86400s
  scheduler:
    poll_interval: 5s
  reaper:
    interval: 60s
    grace: 30s
  embedding:
    timeout: 30s
    max_retries: 3
    provider: openai
    providers:
      openai:
        api_key: "REPLACE_WITH_YOUR_OPENAI_API_KEY"
        base_url: "https://api.openai.com/v1"
        model: "text-embedding-3-small"
  default_threshold: 0.0
collectors:
  rss:
    poll_interval: 300s
  web:
    poll_interval: 900s
  # Telegram userbot collector (FT-009 REQ-02/REQ-03). Credentials come from
  # my.telegram.org; secrets (api_hash, phone) belong only in the uncommitted
  # config.yaml or env — the values below are placeholders (OQ-03, CON-04).
  telegram:
    api_id: 0                              # int32 app id from my.telegram.org
    api_hash: ""                           # secret — do NOT commit
    phone: ""                              # userbot phone, e.g. +10000000000
    session_path: "/var/lib/feedium/tg.session"

syntax = "proto3";

package conf;

option go_package = "github.com/4itosik/feedium/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Summary summary = 3;
  Collectors collectors = 4;
  Scoring scoring = 5;
}

message Server {
  HTTP http = 1;
  GRPC grpc = 2;
}

message HTTP {
  string addr = 1;
  google.protobuf.Duration timeout = 2;
}

message GRPC {
  string addr = 1;
  google.protobuf.Duration timeout = 2;
}

message Data {
  Database database = 1;
}

message Database {
  string host = 1;
  int32 port = 2;
  string database = 3;
  string user = 4;
  string password = 5;
  string sslmode = 6;
}

message Summary {
  SummaryWorker worker = 1;
  SummaryCron cron = 2;
  SummaryLLM llm = 3;
  SummaryCumulative cumulative = 4;
  SummaryOutbox outbox = 5;
  SummarySourceScheduler source_scheduler = 6;
  SummaryReaper reaper = 7;
}

message SummaryWorker {
  google.protobuf.Duration poll_interval = 1;
  int32 concurrency = 3;
  google.protobuf.Duration lease_ttl = 4;
  google.protobuf.Duration heartbeat_interval = 5;
  google.protobuf.Duration graceful_timeout = 6;
  int32 max_attempts = 7;
  google.protobuf.Duration backoff_base = 8;
  google.protobuf.Duration backoff_max = 9;
}

message SummaryCron {
  google.protobuf.Duration interval = 1;
}

message SummarySourceScheduler {
  google.protobuf.Duration poll_interval = 2;
}

message SummaryReaper {
  google.protobuf.Duration interval = 1;
  google.protobuf.Duration grace = 2;
}

// SummaryLLM configures the summarization LLM (FT-005, FT-021). `provider` is
// the default entry of `providers`; `mode_providers` overrides it per
// ProcessingMode (keys: self_contained, cumulative).
message SummaryLLM {
  google.protobuf.Duration timeout = 1;
  int32 max_retries = 2;
  string provider = 3;
  map<string, SummaryLLMProvider> providers = 4;
  map<string, string> mode_providers = 5;
}

// SummaryLLMProvider is one named LLM endpoint. `protocol` selects the wire
// API: "openai" (OpenAI-compatible /chat/completions, e.g. OpenRouter; the
// default when empty) or "anthropic" (Claude Messages API). max_tokens and
// effort apply to the anthropic protocol only.
message SummaryLLMProvider {
  string api_key = 1;
  string base_url = 2;
  string model = 3;
  string protocol = 4;
  int32 max_tokens = 5;
  string effort = 6;
}

message SummaryCumulative {
  google.protobuf.Duration max_window = 1;
  int32 max_input_chars = 2;
}

message SummaryOutbox {
  google.protobuf.Duration event_ttl = 1;
}

// Scoring holds the FT-010 AI scoring configuration: the score worker pool,
// the due-post scheduler, the stuck-event reaper, the embedding provider and the
// default ranked-feed threshold. Worker/scheduler/reaper mirror the Summary
// conventions (DEC-07).
message Scoring {
  ScoringWorker worker = 1;
  ScoringScheduler scheduler = 2;
  ScoringReaper reaper = 3;
  ScoringEmbedding embedding = 4;
  double default_threshold = 5;
}

message ScoringWorker {
  google.protobuf.Duration poll_interval = 1;
  int32 concurrency = 2;
  google.protobuf.Duration lease_ttl = 3;
  google.protobuf.Duration heartbeat_interval = 4;
  google.protobuf.Duration graceful_timeout = 5;
  int32 max_attempts = 6;
  google.protobuf.Duration backoff_base = 7;
  google.protobuf.Duration backoff_max = 8;
  google.protobuf.Duration event_ttl = 9;
}

message ScoringScheduler {
  google.protobuf.Duration poll_interval = 1;
}

message ScoringReaper {
  google.protobuf.Duration interval = 1;
  google.protobuf.Duration grace = 2;
}

message ScoringEmbedding {
  google.protobuf.Duration timeout = 1;
  int32 max_retries = 2;
  string provider = 3;
  map<string, ScoringEmbeddingProvider> providers = 4;
}

message ScoringEmbeddingProvider {
  string api_key = 1;
  string base_url = 2;
  string model = 3;
}

// Collectors holds the collection configuration for the FT-009 content
// collectors. RSS and web use a poll interval (REQ-08, OQ-02); the Telegram
// collector uses a push model (gotd updates.Manager, DEC-08) and carries only
// connection credentials — no poll interval.
message Collectors {
  CollectorPoll rss = 1;
  CollectorPoll web = 2;
  TelegramCollector telegram = 3;
}

message CollectorPoll {
  google.protobuf.Duration poll_interval = 1;
}

// TelegramCollector configures the userbot push collector (FT-009 REQ-02/REQ-03,
// DEC-08). It carries userbot credentials and the server-side session file
// location (OQ-03, CON-04). No poll interval: messages arrive via push
// (gotd updates.Manager), not polling. Secrets (api_hash, phone) live only in
// the uncommitted config.yaml / env — never in committed examples.
message TelegramCollector {
  int32 api_id = 2;
  string api_hash = 3;
  // phone is used only for the manual first-time userbot login (AG-02); the
  // service does not read it at runtime — it reuses the stored session_path.
  string phone = 4;
  string session_path = 5;
}
